<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberShield - Admin: Unlimited Access</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .container { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  h1 span { color: #38bdf8; }
  .subtitle { color: #94a3b8; margin-bottom: 28px; font-size: .95rem; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 22px; margin-bottom: 20px; }
  .card h2 { font-size: 1.05rem; margin-bottom: 14px; color: #cbd5e1; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: .82rem; color: #94a3b8; margin-bottom: 5px; }
  input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: .95rem; }
  input:focus { outline: none; border-color: #38bdf8; }
  button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px;
           border-radius: 8px; font-weight: 600; font-size: .92rem; cursor: pointer; }
  button:hover { background: #7dd3fc; }
  button.danger { background: #ef4444; color: #fff; }
  button.danger:hover { background: #f87171; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { padding: 10px 14px; border-radius: 8px; margin-top: 12px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: #052e16; color: #4ade80; border: 1px solid #14532d; }
  .msg.err { display: block; background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #334155; font-size: .9rem; }
  th { color: #64748b; font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  .empty { color: #64748b; font-style: italic; padding: 10px 0; }
  a.back { color: #38bdf8; text-decoration: none; font-size: .9rem; }
</style>
</head>
<body>
<div class="container">
  <h1>&#128274; CyberShield <span>Admin</span></h1>
  <p class="subtitle">Unlimited subscription access &mdash; manage the whitelist</p>
  <a class="back" href="/">&larr; Back to main site</a>

  <div class="card" style="margin-top:16px">
    <h2>Authenticate</h2>
    <div class="field"><label>Admin email</label>
      <input type="email" id="adminEmail" placeholder="brianleelawson@yahoo.com"></div>
    <div class="field"><label>Admin token</label>
      <input type="password" id="adminToken" placeholder="from /etc/cybershield.env"></div>
    <button id="authBtn" onclick="authenticate()">Connect</button>
    <div id="authMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Unlimited access list <span id="count" style="color:#64748b;font-weight:400"></span></h2>
    <div class="field"><label>Add email</label>
      <input type="email" id="newEmail" placeholder="user@example.com" disabled></div>
    <button id="addBtn" onclick="addEmail()" disabled>+ Add unlimited access</button>
    <div id="addMsg" class="msg"></div>
    <div style="margin-top:18px">
      <table id="listTable"><thead><tr><th>Email</th><th>Added</th><th>By</th><th></th></tr></thead><tbody></tbody></table>
      <div class="empty" id="emptyNote">Not connected</div>
    </div>
  </div>
</div>
<script>
let authed = false;
const H = () => ({ 'X-Admin-Email': document.getElementById('adminEmail').value.trim(),
                   'X-Admin-Token': document.getElementById('adminToken').value.trim() });

function show(el, text, ok) {
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
  setTimeout(() => { el.className = 'msg'; }, 5000);
}

async function authenticate() {
  const m = document.getElementById('authMsg');
  try {
    const r = await fetch('/api/admin/whitelist', { headers: H() });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    authed = true;
    document.getElementById('newEmail').disabled = false;
    document.getElementById('addBtn').disabled = false;
    show(m, 'Connected.', true);
    loadList();
  } catch (e) { show(m, 'Auth failed: ' + e.message, false); }
}

async function loadList() {
  const r = await fetch('/api/admin/whitelist', { headers: H() });
  if (!r.ok) { authed = false; return; }
  const d = await r.json();
  document.getElementById('count').textContent = '(' + d.count + ')';
  const tb = document.querySelector('#listTable tbody');
  tb.innerHTML = '';
  document.getElementById('emptyNote').style.display = d.count ? 'none' : 'block';
  for (const e of d.whitelist) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + e.email + '</td><td>' + e.added + '</td><td>' + e.added_by + '</td>' +
      '<td><button class="danger" onclick="removeEmail(\'' + e.email + '\')">Remove</button></td>';
    tb.appendChild(tr);
  }
}

async function addEmail() {
  const email = document.getElementById('newEmail').value.trim();
  if (!email) return;
  const m = document.getElementById('addMsg');
  try {
    const r = await fetch('/api/admin/whitelist', {
      method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H()),
      body: JSON.stringify({ email }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    document.getElementById('newEmail').value = '';
    show(m, email + ' added.', true);
    loadList();
  } catch (e) { show(m, e.message, false); }
}

async function removeEmail(email) {
  const m = document.getElementById('addMsg');
  try {
    const r = await fetch('/api/admin/whitelist?email=' + encodeURIComponent(email), {
      method: 'DELETE', headers: H() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    show(m, email + ' removed.', true);
    loadList();
  } catch (e) { show(m, e.message, false); }
}
</script>
</body>
</html>
